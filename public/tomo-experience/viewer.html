<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tomo | Sergio Piñeros</title><style>*{box-sizing:border-box}body{margin:0;background:#eae7ed;color:#211b2b;font-family:Arial,sans-serif;overflow:hidden}.toolbar{height:70px;display:flex;justify-content:center;align-items:center;gap:8px;background:#faf8fb;border-bottom:1px solid #ddd4e4}button{display:grid;place-items:center;width:46px;height:46px;border:0;border-radius:12px;background:transparent;color:inherit;cursor:pointer}button.active{background:#dfd1ef}button:hover{background:#e9def3}button:focus-visible{outline:3px solid #8a63b1;outline-offset:2px}svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.divider{height:27px;width:1px;background:#d3cadc;margin:0 8px}#reason{font-size:25px;font-weight:500}.canvas{height:calc(100dvh - 70px);display:flex;justify-content:center;overflow:hidden;padding:0 18px;background:#eae7ed}iframe{width:100%;height:100%;border:0;background:#f5f1ee;transition:width .4s ease;box-shadow:0 0 35px #211b2b10}.canvas.tablet iframe{width:min(820px,100%)}.canvas.phone iframe{width:min(390px,100%)}@media(max-width:600px){.canvas{padding:0}.toolbar{height:60px;gap:5px}.canvas{height:calc(100dvh - 60px)}}@media(prefers-reduced-motion:reduce){iframe{transition:none}}</style></head><body><div class="toolbar" role="toolbar" aria-label="Preview controls"><button id="desktop" class="active" title="Desktop" aria-label="Desktop view" aria-pressed="true"><svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 22h8M12 17v5"/></svg></button><button id="tablet" title="iPad" aria-label="iPad view" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="4" y="1" width="16" height="22" rx="3"/><path d="M10 20h4"/></svg></button><button id="phone" title="Phone" aria-label="Phone view" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="6" y="1" width="12" height="22" rx="3"/><path d="M10 4h4M11 20h2"/></svg></button><span class="divider"></span><button id="reason" title="Why these decisions" aria-label="Show design decisions" aria-pressed="false">?</button></div><div class="canvas" id="canvas"><iframe title="Tomo website and redesign" id="experience" src="experience.html"></iframe></div><script>const frame=document.querySelector('iframe');let notes=false;['desktop','tablet','phone'].forEach(name=>document.getElementById(name).onclick=()=>{document.getElementById('canvas').className='canvas '+name;['desktop','tablet','phone'].forEach(id=>{document.getElementById(id).classList.toggle('active',id===name);document.getElementById(id).setAttribute('aria-pressed',id===name)});});document.getElementById('reason').onclick=()=>{notes=!notes;document.getElementById('reason').classList.toggle('active',notes);document.getElementById('reason').setAttribute('aria-pressed',notes);frame.contentWindow.postMessage({type:'tomo-notes',value:notes},location.origin)};frame.onload=()=>frame.contentWindow.postMessage({type:'tomo-notes',value:notes},location.origin);</script></body></html>
